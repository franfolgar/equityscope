services:
  - type: web
    name: equityscope-api-franfolgar
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: https://franfolgar.github.io,http://localhost:5173,http://127.0.0.1:5173
